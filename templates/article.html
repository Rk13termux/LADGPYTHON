<div class="reading-progress" aria-hidden="true"><span id="readingProgress"></span></div>

<div class="container">
    <nav class="breadcrumb article-breadcrumb" aria-label="Miga de pan">
        <a href="/">Inicio</a>
        <span aria-hidden="true">/</span>
        <a href="/guias/">Guías</a>
        <span aria-hidden="true">/</span>
        <span aria-current="page">{{SHORT_TITLE}}</span>
    </nav>
</div>

<header class="article-hero">
    <div class="container">
        <span class="badge badge-{{CATEGORY}}"><i class="{{CATEGORY_ICON}}" aria-hidden="true"></i> {{CATEGORY_LABEL}}</span>
        <h1 class="article-title">{{TITLE}}</h1>
        <p class="article-summary">{{SUMMARY}}</p>
        <div class="article-meta">
            <span><i class="far fa-calendar" aria-hidden="true"></i> Actualizado el {{DATE_HUMAN}}</span>
            <span><i class="far fa-clock" aria-hidden="true"></i> {{READING}} min de lectura</span>
            <span><i class="fas fa-signal" aria-hidden="true"></i> Nivel {{LEVEL}}</span>
            <span><i class="fas fa-user-pen" aria-hidden="true"></i> Equipo CHMODX</span>
        </div>
        <div class="tag-list">
            {{TAGS}}
        </div>
    </div>
</header>

<div class="container article-shell">
    <article class="article-main">
        <div class="article-body">
            {{BODY}}
        </div>

        {{END_CTA}}

        <section class="related" aria-labelledby="relatedTitle">
            <h2 id="relatedTitle">Sigue aprendiendo</h2>
            <div class="card-grid card-grid-3">
                {{RELATED}}
            </div>
        </section>
    </article>

    <aside class="article-side">
        {{TOC}}

        {{SIDEBAR_ACADEMY}}

        {{SIDEBAR_TELEGRAM}}
    </aside>
</div>
